# Renders the guide, docs/guide.md, with the documents that have a page of their own, and publishes
# them to GitHub Pages whenever they or what renders them change. Pages must have "GitHub Actions"
# as its source in the repository's settings.
name: Guide

on:
  push:
    branches: [main]
    paths:
      - docs/guide.md
      - docs/design.md
      - docs/semantics.md
      - docs/bytecode.md
      - docs/ffi.md
      - docs/buffers.md
      - docs/grammar.md
      - docs/io.md
      - docs/fs.md
      - docs/processes.md
      - docs/tree-sitter.md
      - docs/framing.md
      - docs/io-sockets.md
      - docs/deadlines.md
      - docs/http-head.md
      - docs/http.md
      - docs/http-streaming.md
      - docs/http-listener.md
      - docs/json.md
      - docs/datalog.md
      - docs/curl.md
      - site/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Render the guide
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          make guide
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/guide
      - id: deploy
        uses: actions/deploy-pages@v5
